server:
  port: 8085

spring:
  application:
    name: catalog-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/catalog_db}
    username: ${DB_USER:picturesai}
    password: ${DB_PASSWORD:picturesAI}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:picturesAI}
      timeout: 2s
  cache:
    type: redis
    redis:
      time-to-live: 300000
      cache-null-values: false
      use-key-prefix: true
      key-prefix: "catalog:"
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:127.0.0.1:29092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
  threads:
    virtual:
      enabled: true

catalog:
  kafka:
    group-id: catalog-service
    topics:
      generation-completed: generation.completed
      tags-extracted: tags.extracted
      user-created: user.created
      user-deleted: user.deleted
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:picturesAI}
    secret-key: ${MINIO_SECRET_KEY:picturesAI}
    presigned-ttl-seconds: 3600
  feed:
    page-size-default: 20
    page-size-max: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: catalog-service
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"