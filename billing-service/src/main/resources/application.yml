server:
  port: 8086

spring:
  application:
    name: billing-service

  datasource:
    url: jdbc:postgresql://localhost:5433/billing_db
    username: picturesai
    password: picturesAI
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379
      password: picturesAI

nats:
  url: nats://localhost:4222
  user: picturesAI
  password: picturesAI
  subjects:
    reserve-quota: billing.reserveQuota
    confirm-quota: billing.confirmQuota
    release-quota: billing.releaseQuota

billing:
  plans:
    FREE:
      daily-limit: 10
    PRO:
      daily-limit: 100
  reservation-ttl-minutes: 15
  cleanup-interval-ms: 60000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces