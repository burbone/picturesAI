spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:1/test
          jwk-set-uri: http://localhost:1/test/jwks
  data:
    redis:
      host: localhost
      port: 6379
      password: ""

app:
  rate-limit:
    free: 2
    pro: 100
    billing: 30

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 2s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

management:
  health:
    redis:
      enabled: false
  tracing:
    enabled: false