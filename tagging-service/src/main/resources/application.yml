server:
  port: 8084

spring:
  application:
    name: tagging-service

  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/tags_db
    username: picturesai
    password: picturesAI

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: 127.0.0.1:29092
    consumer:
      group-id: tagging-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual
      missing-topics-fatal: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

tagging:
  mode: ${TAGGING_MODE:keywords}
  llm:
    endpoint: ${OLLAMA_URL:http://127.0.0.1:11434}
    model: qwen2.5:1.5b
    timeout-ms: 10000
    max-tags: 10
  keyword:
    max-tags: 10
    min-weight: 0.1
  outbox:
    fixed-delay-ms: 500
    batch-size: 100
    send-timeout-ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}