spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/generations_db
    username: picturesAI
    password: picturesAI
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ""
  kafka:
    bootstrap-servers: 127.0.0.1:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        delivery.timeout.ms: 5000
        request.timeout.ms: 3000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false

management:
  tracing:
    enabled: false
  endpoints:
    web:
      exposure:
        include: health

minio:
  endpoint: http://127.0.0.1:9000
  access-key: picturesAI
  secret-key: picturesAI
  originals-bucket: ai-gallery-originals-e2e
  thumbnails-bucket: ai-gallery-thumbnails-e2e
  presigned-ttl-seconds: 3600

nats:
  url: nats://127.0.0.1:4222
  username: ""
  password: ""

generation:
  dispatcher:
    total-slots: 3
    slots-pro-reserved: 2
    slots-free-reserved: 1
    premium-queue-capacity: 10
    free-queue-capacity: 10
    idle-poll-ms: 20
  consumer:
    pro-topic: generation.requested.pro
    free-topic: generation.requested.free
    pro-group-id: e2e-pro
    free-group-id: e2e-free
    poll-timeout-ms: 200
    idle-park-ms: 20
  retry:
    max-attempts: 3
    delay-seconds: 1
    dlq-topic: generation.requested.dlq
    scheduler-batch-size: 100

mock:
  latency-ms: 10
  latency-jitter-ms: 0
  error-rate-429: 0.0
  error-rate-5xx: 0.0