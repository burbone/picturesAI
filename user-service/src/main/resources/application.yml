server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/users_db}
    username: ${DB_USER:picturesai}
    password: ${DB_PASSWORD:picturesAI}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
  security:
    oauth2:
      client:
        registration:
          user-service-admin:
            client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:user-service-admin}
            client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:change-me}
            authorization-grant-type: client_credentials
            provider: user-service-admin
        provider:
          user-service-admin:
            token-uri: ${KEYCLOAK_BASE_URL:http://localhost:8090}/realms/${KEYCLOAK_REALM:ai-gallery}/protocol/openid-connect/token

outbox:
  publisher:
    enabled: true
    poll-interval-ms: 500
    initial-delay-ms: 0
    batch-size: 100

user:
  deletion:
    enabled: true
    poll-interval-ms: 30000
    initial-delay-ms: 30000
    batch-size: 50

keycloak:
  base-url: ${KEYCLOAK_BASE_URL:http://localhost:8090}
  realm: ${KEYCLOAK_REALM:ai-gallery}
  admin:
    registration-id: user-service-admin

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: user-service
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"